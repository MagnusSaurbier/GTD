name: GTD
options:
  bundleIdPrefix: com.magnussaurbier
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: true
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is the user's: set your team here (or in Xcode → Signing & Capabilities) before
    # running on a device. The macOS and simulator builds work unsigned — see App/README.md.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true

packages:
  GTDKit:
    path: Packages/GTDKit

targets:
  GTD:
    # One multiplatform target (ARCHITECTURE §1). T40 owns this file from here on.
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "README.md"
          # Generated by this file; listing it as a source would copy it into the bundle twice.
          - "Info.plist"
          - "GTD.entitlements"
    info:
      path: App/Info.plist
      properties:
        # Dock, Finder, the application menu and the iOS home screen name the build by its
        # version ("GTD - 0.2"), so "which build is this?" needs no window (docs/TICKETS.md).
        CFBundleDisplayName: GTD - $(MARKETING_VERSION)
        CFBundleName: GTD - $(MARKETING_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          # Deep links, from notifications (`NotificationRoute`) and App Intents
          # (`GTDIntents.RoutineDeepLink` / `InboxDeepLink`): gtd://routine/<id>,
          # gtd://action/<path>, gtd://waiting, gtd://inbox. Parsed by `App/AppRoute.swift`.
          - CFBundleURLName: com.magnussaurbier.gtd
            CFBundleURLSchemes: [gtd]
        # D2 — background app refresh re-reads the vault and re-plans notifications while the
        # app is away (`App/BackgroundRefresh.swift`). The identifier must match exactly.
        BGTaskSchedulerPermittedIdentifiers:
          - com.magnussaurbier.gtd.refresh
        UIBackgroundModes:
          - fetch
        # The vault is reached through a security-scoped bookmark to a user-picked folder
        # (ARCHITECTURE §6, T01), so the app needs no iCloud container and exposes no documents
        # of its own: UIFileSharingEnabled / LSSupportsOpeningDocumentsInPlace stay off.
    entitlements:
      path: App/GTD.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnussaurbier.gtd
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # App Intents (`GTDIntents`) live in the package, not in this target. If the three
        # shortcuts do not show up in the Shortcuts app, see App/README.md "App Intents".
    dependencies:
      - package: GTDKit
        product: GTDKit

  GTDTests:
    # Unit tests for the shell's own logic (routes, device id, notification settings mapping).
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AppTests
    dependencies:
      - target: GTD
      - package: GTDKit
        product: GTDKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnussaurbier.gtd.tests
        GENERATE_INFOPLIST_FILE: true
        # XcodeGen writes the iOS bundle layout (`GTD.app/GTD`) for a multiplatform target; on
        # macOS the executable is under Contents/MacOS, which this variable resolves per platform.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GTD.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GTD

  GTDUITests:
    # Launch-and-navigate smoke tests; they always run on `-useFixtures`, never on a real vault.
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AppUITests
    dependencies:
      - target: GTD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnussaurbier.gtd.uitests
        GENERATE_INFOPLIST_FILE: true

schemes:
  GTD:
    build:
      targets:
        GTD: all
        GTDTests: [test]
        GTDUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GTDTests
        - GTDUITests
